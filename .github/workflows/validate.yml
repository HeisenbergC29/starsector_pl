        run: |
          python3 tools/verify_1038.py worktree
          python3 tools/verify_review_1038.py worktree --prior-ledger docs/API_SEMANTIC_REVIEW_1037.json --ledger docs/API_SEMANTIC_REVIEW_1038.json
          python3 tools/test_1038.py worktree
      - name: Apply 1.0.39 pronoun-free player-facing rules.csv dialogues
        run: python3 tools/apply_1039.py worktree
      - name: Verify 62 precise dialogue rows and all 153 immutable review records
        run: |
          python3 tools/verify_1039.py worktree
          python3 tools/verify_review_1039.py worktree --ledger34 docs/RULES_PRONOUN_REVIEW_1034.json --ledger35 docs/RULES_PRONOUN_REVIEW_1035.json --ledger docs/RULES_PRONOUN_REVIEW_1039.json
          python3 tools/test_1039.py worktree
      - name: Apply 1.0.40 reviewed gendered BaseGetCommodity UI phrases
        run: python3 tools/apply_1040.py worktree
      - name: Verify 1.0.40 literal-only API map, 12 getter callsites and 24 Polish fragments
        run: |
          python3 tools/verify_1040.py worktree
          python3 tools/verify_review_1040.py worktree --prior-ledger docs/API_SEMANTIC_REVIEW_1038.json --ledger docs/API_SEMANTIC_REVIEW_1040.json
          python3 tools/test_1040.py worktree
      - name: Apply 1.0.41 numeric grammar and JAR ZIP-integrity safeguard
        run: python3 tools/apply_1041.py worktree
      - name: Verify all 77 numeric text changes, unchanged JVM status and ZIP-integrity guard
        run: |
          python3 tools/verify_1041.py worktree
          python3 tools/test_1041.py worktree
          python3 -m py_compile tools/test_noop_integrity_1041.py
      - name: Apply 1.0.42 exact punctuation fixes after 1.0.41 numeric grammar
        run: python3 tools/apply_1042.py worktree
      - name: Verify 15 double-dot repairs in all 5257 API strings and test rejection of unapproved edits
        run: |
          python3 tools/verify_1042.py worktree
          python3 tools/test_1042.py worktree
          python3 -m py_compile tools/test_noop_integrity_1042.py
      - name: Apply 1.0.43 grammar-safe rules.csv noun-phrase fixes
        run: python3 tools/apply_1043.py worktree
      - name: Verify 31 strictly controlled dialogue fields and 153 protected older reviews
        run: |
          python3 tools/verify_1043.py worktree
          python3 tools/verify_review_1043.py worktree --ledger34 docs/RULES_PRONOUN_REVIEW_1034.json --ledger35 docs/RULES_PRONOUN_REVIEW_1035.json --ledger39 docs/RULES_PRONOUN_REVIEW_1039.json --ledger docs/RULES_POSSESSIVE_REVIEW_1043.json
          python3 tools/test_1043.py worktree
      - name: Release gate audit for 1.1 (current development version is 1.0.43)
        run: |
          python3 tools/test_dynamic_1030.py
          python3 tools/audit_semantic_queue_1030.py worktree/buildtools/NARZEDZIA_JAR/ZRODLA_EXE_GO/translations/TLUMACZENIA_JAR_1030.csv --private-out /tmp/ST_1030_PRIVATE_QUEUE.json --summary-out /tmp/ST_1030_SEMANTIC_SUMMARY.json
          python3 tools/check_release_gates_1043.py worktree --gates docs/RELEASE_GATES_1043.json
          python3 tools/test_release_gates_1043.py worktree --gates docs/RELEASE_GATES_1043.json
      - name: Apply 1.0.44 gender-neutral rules.csv text corrections
        run: python3 tools/apply_1044.py worktree --ledger-out /tmp/RULES_GENDER_1044_generated.json
      - name: Verify 25 new dialogue rows, reject invalid changes and audit remaining 1.1 gates
        run: |
          python3 tools/verify_1044.py worktree
          python3 tools/test_1044.py worktree
          python3 tools/check_release_gates_1044.py worktree --gates docs/RELEASE_GATES_1044.json --ledger docs/RULES_GENDER_REVIEW_1044.json
          diff -u docs/RULES_GENDER_REVIEW_1044.json /tmp/RULES_GENDER_1044_generated.json
      - name: Apply 1.0.45 reviewed dialogue wording changes
        run: python3 tools/apply_1045.py worktree --ledger-out /tmp/REVIEW_1045.json
      - name: Verify exact 1.0.45 delta, protected older reviews, and negative mutations
        run: |
          python3 tools/verify_1045.py worktree --prior-ledger docs/RULES_PRONOUN_REVIEW_1034.json --prior-ledger docs/RULES_PRONOUN_REVIEW_1035.json --prior-ledger docs/RULES_PRONOUN_REVIEW_1039.json --prior-ledger docs/RULES_POSSESSIVE_REVIEW_1043.json --prior-ledger docs/RULES_GENDER_REVIEW_1044.json
          python3 tools/test_1045.py worktree
          diff -u docs/RULES_GENDER_REVIEW_1045.json /tmp/REVIEW_1045.json
      - name: Audit full remaining pronoun token corpus and block premature 1.1
        run: |
          python3 tools/audit_rules_pronouns_1045.py worktree/mod/data/campaign/rules.csv --output /tmp/PRONOUN_1045.json
          diff -u docs/PRONOUN_AUDIT_1045.json /tmp/PRONOUN_1045.json
          python3 tools/check_release_gates_1045.py worktree --gates docs/RELEASE_GATES_1045.json --ledger docs/RULES_GENDER_REVIEW_1045.json
          python3 tools/test_release_gates_1045.py worktree --gates docs/RELEASE_GATES_1045.json --ledger docs/RULES_GENDER_REVIEW_1045.json
      - name: Apply 1.0.46 class-scoped Java API corrections and three new assembled fragments
        run: python3 tools/apply_1046.py worktree
      - name: Verify 1.0.46 exact API delta and 8 negative mapping mutations
        run: |
          python3 tools/verify_1046.py worktree
          python3 tools/test_1046.py worktree
          python3 -m py_compile tools/audit_1046_jvm.py
      - name: Audit 20 newly reviewed API translations and 1.1 release gates
        run: |
          python3 tools/verify_review_1046.py worktree --previous docs/API_SEMANTIC_REVIEW_1040.json --ledger docs/API_SEMANTIC_REVIEW_1046.json
          python3 tools/check_release_gates_1046.py worktree --gates docs/RELEASE_GATES_1046.json --previous docs/API_SEMANTIC_REVIEW_1040.json --ledger docs/API_SEMANTIC_REVIEW_1046.json
