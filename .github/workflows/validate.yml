name: Verify Polish localization project

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structural-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Verify Git snapshot and restore project
        run: python3 tools/restore_snapshot.py
      - name: Apply reviewed 1.0.13 localization overlay to 1.0.12 snapshot
        run: python3 tools/apply_1013.py worktree
      - name: Apply reviewed 1.0.14 localization overlay to 1.0.13 worktree
        run: python3 tools/apply_1014.py worktree
      - name: Apply verified 1.0.15 OBF and API UI translations
        run: python3 tools/apply_1015.py worktree
      - name: Apply 1.0.16 verified OBF and API UI text overlay
        run: python3 tools/apply_1016.py worktree
      - name: Apply 1.0.17 OBF/API tutorial and UI translations
        run: python3 tools/apply_1017.py worktree
      - name: Verify tutorial markup, Polish ship labels and approved map delta
        run: python3 tools/verify_1017_texts.py worktree
      - name: Apply 1.0.18 subject-pronoun translations
        run: python3 tools/apply_1018.py worktree
      - name: Verify 1.0.18 literal-only map delta
        run: python3 tools/verify_subject_pronouns_1018.py worktree
      - name: Apply 1.0.19 composed ability-tooltip translation corrections
        run: python3 tools/apply_1019.py worktree
      - name: Verify 1.0.19 approved mapping delta and UI assembly guards
        run: python3 tools/verify_1019_tooltip.py worktree
      - name: Apply 1.0.20 gender-sensitive dialogue corrections
        run: python3 tools/apply_1020.py worktree
      - name: Verify male/female assembled dialogues and approved translation-only delta
        run: python3 tools/verify_1020_dialogs.py worktree
      - name: Apply 1.0.21 additional visible UI texts and data-name corrections
        run: python3 tools/apply_1021.py worktree
      - name: Verify 1.0.21 translation-only map and data delta
        run: python3 tools/verify_1021_delta.py worktree
      - name: Test original-vs-localized field integrity scanner on synthetic fixtures
        run: python3 tools/test_source_fields_1021.py
      - name: Apply 1.0.22 canonical Persean League names without changing Java JAR maps
        run: python3 tools/apply_1022.py worktree
      - name: Verify exactly 65 translated names, unchanged 867 data files and regression fixtures
        run: |
          python3 tools/verify_1022_names.py worktree
          python3 tools/test_1022_names.py
      - name: Apply 1.0.23 reviewed UI literal translations (OBF +41, API +26)
        run: python3 tools/apply_1023.py worktree
      - name: Verify exact 1.0.23 mappings and unchanged data files
        run: python3 tools/verify_1023_ui.py worktree
      - name: Validate every data file and dialog option
        run: |
          python3 tools/check_project.py worktree/mod
          python3 worktree/maintenance/check_rules_options.py worktree/mod/data/campaign/rules.csv
      - name: Audit Java literal risks and mission-text coverage (report only)
        run: python3 tools/audit_localization_risks.py worktree --out audit_localization_risks.json
      - name: Test error detection on malformed option
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, tempfile, shutil
          spec = importlib.util.spec_from_file_location('audit', 'tools/check_project.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as d:
              dst = pathlib.Path(d) / 'mod'
              shutil.copytree('worktree/mod', dst)
              rule = dst / 'data/campaign/rules.csv'
              contents = rule.read_bytes()
              assert b'lpp_devAddFaithful:' in contents
              rule.write_bytes(contents.replace(b'lpp_devAddFaithful:', b'lpp_devAddFaithful:invalid:'))
              result = module.audit_mod(dst)
              assert any('Invalid option' in err for err in result['errors'])
          print('Malformed option rejected as expected')
          PY
      - name: Go tests and static analysis (OBF, API)
        run: |
          (cd worktree/buildtools/NARZEDZIA_OBF && GO111MODULE=off go test ./... && GO111MODULE=off go vet ./...)
          (cd worktree/buildtools/NARZEDZIA_JAR/ZRODLA_EXE_GO && GO111MODULE=off go test ./... && GO111MODULE=off go vet ./...)
      - name: Cross-compile Windows EXEs and test installer
        run: |
          (cd worktree && sh build_windows.sh)
          (cd worktree/buildtools/NARZEDZIA_INSTALATOR && GO111MODULE=off go test ./... && GO111MODULE=off go vet ./...)
          file worktree/obf_windows.exe worktree/api_windows.exe worktree/Starsector_PL_Instalator.exe
          file worktree/obf_windows.exe | grep -q 'PE32+ executable.*x86-64'
          file worktree/api_windows.exe | grep -q 'PE32+ executable.*x86-64'
          file worktree/Starsector_PL_Instalator.exe | grep -q 'PE32+ executable.*x86-64'