      - name: Apply 1.0.31 data-only Surveying Equipment grammar correction
        run: python3 tools/apply_1031.py worktree
      - name: Verify exactly one 1.0.31 data text changed, unchanged JAR maps and reviewed UI ledger
        run: |
          python3 tools/verify_1031.py worktree
          python3 tools/verify_review_1031.py --map worktree/buildtools/NARZEDZIA_JAR/ZRODLA_EXE_GO/translations/TLUMACZENIA_JAR_1030.csv --ledger docs/API_SEMANTIC_REVIEW_1031.json
          python3 tools/test_1031.py
      - name: Apply 1.0.32 reviewed light-year tooltip and numeric quantity corrections
        run: python3 tools/apply_1032.py worktree
      - name: Verify exact 1.0.32 map and eight assembled text combinations
        run: |
          python3 tools/verify_1032.py worktree
          python3 tools/verify_review_1032.py --map worktree/buildtools/NARZEDZIA_JAR/ZRODLA_EXE_GO/translations/TLUMACZENIA_JAR_1032.csv --old-ledger docs/API_SEMANTIC_REVIEW_1031.json --ledger docs/API_SEMANTIC_REVIEW_1032.json
          python3 tools/test_1032.py worktree
      - name: Apply 1.0.33 Polish PF story-point translations at 81 callsites
        run: python3 tools/apply_1033.py worktree
