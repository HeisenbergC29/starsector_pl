          python3 tools/verify_1047.py worktree
          python3 tools/test_1047.py worktree
          diff -u docs/API_NUMERIC_DELTA_1047.json /tmp/API_NUMERIC_DELTA_1047.json
      - name: Verify 38 further API semantic reviews, 1.1 release gates and private audit test sources
        run: |
          python3 tools/verify_review_1047.py worktree --previous docs/API_SEMANTIC_REVIEW_1046.json --ledger docs/API_SEMANTIC_REVIEW_1047.json
          python3 tools/check_release_gates_1047.py worktree --gates docs/RELEASE_GATES_1047.json --previous docs/API_SEMANTIC_REVIEW_1046.json --ledger docs/API_SEMANTIC_REVIEW_1047.json
          python3 tools/test_release_gates_1047.py worktree --gates docs/RELEASE_GATES_1047.json --previous docs/API_SEMANTIC_REVIEW_1046.json --ledger docs/API_SEMANTIC_REVIEW_1047.json
          python3 -m py_compile tools/audit_1047_jvm.py tools/private_upgrade_1047.py
      - name: Apply 1.0.48 exact 29 numeric grammar corrections in API
        run: python3 tools/apply_1048.py worktree --report /tmp/NUMERIC_DELTA_1048.json
      - name: Verify 1.0.48 29-map delta, byte-exact technical fields, 87 renders and 8 negative tests
