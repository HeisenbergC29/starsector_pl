          python3 tools/check_release_gates_1049.py worktree --gates docs/RELEASE_GATES_1049.json --previous docs/API_SEMANTIC_REVIEW_1048.json --ledger docs/API_SEMANTIC_REVIEW_1049.json
          python3 tools/test_release_gates_1049.py worktree --gates docs/RELEASE_GATES_1049.json --previous docs/API_SEMANTIC_REVIEW_1048.json --ledger docs/API_SEMANTIC_REVIEW_1049.json
