        run: |
          python3 tools/verify_review_1048.py worktree --previous docs/API_SEMANTIC_REVIEW_1047.json --ledger docs/API_SEMANTIC_REVIEW_1048.json
          python3 tools/check_release_gates_1048.py worktree --gates docs/RELEASE_GATES_1048.json --previous docs/API_SEMANTIC_REVIEW_1047.json --ledger docs/API_SEMANTIC_REVIEW_1048.json
          python3 tools/test_release_gates_1048.py worktree --gates docs/RELEASE_GATES_1048.json --previous docs/API_SEMANTIC_REVIEW_1047.json --ledger docs/API_SEMANTIC_REVIEW_1048.json
