          python3 tools/test_release_gates_1051.py worktree --gates docs/RELEASE_GATES_1051.json --previous docs/API_SEMANTIC_REVIEW_1050.json --ledger docs/API_SEMANTIC_REVIEW_1051.json
          python3 -m py_compile tools/private_jvm_1051.py tools/private_upgrade_1051.py
      - name: Apply 1.0.52 inherited bar-event feminine dative and possessive pronouns
